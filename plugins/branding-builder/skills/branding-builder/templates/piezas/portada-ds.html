<!-- @dsCard height=300 -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Plantilla de ESTRUCTURA: portada del Design System (project/components/Cover/preview.html).
     La línea 1 tiene que ser el comentario @dsCard. Dentro del Design System ya están cargados los tokens
     y las fuentes: usa solo var(--token) y var(--font-…). Lee cover.md del tipo antes de componerla.
     Para revisarla en local, añade temporalmente <link rel="stylesheet" href="brand.css"> y renderiza 960×300. -->
<style>
  html, body { margin: 0; background: var(--bg); }
  .cover { position: relative; width: 960px; height: 300px; overflow: hidden; background: var(--bg); }
  .art { position: absolute; left: 0; top: 0; }
  .a { fill: var(--ink); }
  .b { fill: var(--ink-muted); }
  .c { fill: var(--border); }
  .name { position: absolute; left: 48px; bottom: 48px; max-width: 420px; }
  .name h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 72px; line-height: .95; letter-spacing: -0.03em; color: var(--ink); }
  .name p { margin: 16px 0 0; font-family: var(--font-sans); font-size: 14px; line-height: 1.4; color: var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
  <svg class="art" width="960" height="300" viewBox="0 0 960 300" xmlns="http://www.w3.org/2000/svg">
    <!-- Bloques a la derecha de x=480 en una rejilla de spacing; el motivo (cortes, curvas, módulos)
         sale de la regla geométrica del logo. Sustituye estos bloques de ejemplo. -->
    <rect class="a" x="480" y="-14" width="192" height="314" rx="14"/>
    <rect class="b" x="688" y="-14" width="286" height="206" rx="14"/>
    <rect class="c" x="688" y="208" width="286" height="96" rx="14"/>
  </svg>
  <div class="name">
    <h1>Nombre<br>de marca</h1>
    <p>Eslogan. Una frase sobre qué es la marca.</p>
  </div>
</div>
</body>
</html>
