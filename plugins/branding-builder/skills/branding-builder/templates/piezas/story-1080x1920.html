<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="lienzo" content="1080x1920">
<!-- Plantilla de ESTRUCTURA: story 1080×1920. La interfaz de la app tapa aprox. 250 px arriba y 340 px abajo:
     no pongas texto ni logo ahí. Parámetros: ?tema=<id> ?guias=1 -->
<link rel="stylesheet" href="brand.css">
<style>
html, body { margin: 0; }
.lienzo { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); color: var(--ink); }
.seguro { position: absolute; top: 250px; bottom: 340px; left: 80px; right: 80px; display: flex; flex-direction: column; justify-content: space-between; }
.etiqueta { font-family: var(--font-mono); font-size: 28px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
.titular { font-family: var(--font-display); font-weight: 700; font-size: 112px; line-height: .95; letter-spacing: -.03em; }
.titular { margin: 0; }
.texto { font-family: var(--font-sans); font-size: 36px; line-height: 1.4; color: var(--ink-muted); }
.texto { margin: 32px 0 0; max-width: 820px; }
.logo { height: 120px; display: block; }
.motivo { position: absolute; left: 0; right: 0; bottom: 0; height: 340px; background-image: url("patron.svg"); }
.guias .seguro { outline: 2px dashed #f0f; }
.guias .lienzo::before, .guias .lienzo::after { content: ""; position: absolute; left: 0; right: 0; background: #f0f3; }
.guias .lienzo::before { top: 0; height: 250px; }
.guias .lienzo::after { bottom: 0; height: 340px; }
</style>
</head>
<body>
<div class="lienzo">
  <div class="motivo" aria-hidden="true"></div>
  <div class="seguro">
    <div class="etiqueta" data-ejemplo>CATEGORÍA · LUNES</div>
    <div>
      <h1 class="titular" data-ejemplo>Titular de ejemplo para la story.</h1>
      <p class="texto" data-ejemplo>Una frase de apoyo corta que explica el titular.</p>
    </div>
    <img class="logo" src="logo.svg" alt="">
  </div>
</div>
<script>
const q = new URLSearchParams(location.search);
if (q.get("guias")) document.documentElement.classList.add("guias");
if (q.get("tema")) document.documentElement.dataset.theme = q.get("tema");
</script>
</body>
</html>
