<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="lienzo" content="1024x1024">
<!-- Plantilla de ESTRUCTURA: icono de app CUADRADO A SANGRE 1024×1024 (sin esquinas).
     Después: iconos.py esquinas → SIGLA-app-icon-<fondo>_1024.png con esquinas al 22,37%,
     e iconos.py derivar → apple-touch-icon, android-chrome y favicon.ico.
     El símbolo ocupa ≈ 56% y queda dentro de la zona segura de las máscaras de iOS y Android. ?tema=<id> ?guias=1 -->
<link rel="stylesheet" href="brand.css">
<style>
html, body { margin: 0; }
.lienzo { width: 1024px; height: 1024px; display: grid; place-items: center; background: var(--bg); position: relative; }
.lienzo img { width: 56%; height: 56%; object-fit: contain; display: block; }
.guias .lienzo::after { content: ""; position: absolute; inset: 102px; border-radius: 50%; outline: 3px dashed #f0f; }
</style>
</head>
<body>
<div class="lienzo"><img src="logo.svg" alt=""></div>
<script>
const q = new URLSearchParams(location.search);
if (q.get("guias")) document.documentElement.classList.add("guias");
if (q.get("tema")) document.documentElement.dataset.theme = q.get("tema");
</script>
</body>
</html>
