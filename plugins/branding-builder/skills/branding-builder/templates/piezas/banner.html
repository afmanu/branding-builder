<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Plantilla de ESTRUCTURA: banners de perfil y cabeceras (YouTube, X, LinkedIn, Facebook, Bluesky, Twitch,
     Discord, Skool, Whop, Pinterest, newsletter y la imagen OG). Medidas, zonas seguras y zonas tapadas salen de
     banners-formatos.js (cópialo al lado): no las escribas aquí.
     Parámetros: ?f=<clave> (ver banners.py lista) · ?w=&h= tamaño comprobado en la pantalla de subida si difiere
     · ?guias=1 zonas visibles · ?tema=<id> · ?alinear=centro|derecha|izquierda · ?lema= · ?dato=
     Renderiza con banners.py lote (pone nombre y tamaño) o: render.py png banner.html X-cabecera_1500x500.png --param f=x
     La composición es un punto de partida: el fondo, el motivo y el orden de los elementos los decide cada marca. -->
<link rel="stylesheet" href="brand.css">
<script src="banners-formatos.js"></script>
<style>
html, body { margin: 0; }
.lienzo { position: relative; overflow: hidden; background: var(--bg); color: var(--ink); }
/* Fondo: llena TODO el lienzo (lo recortado también se ve en algún dispositivo). Sustitúyelo por el de la marca. */
.fondo { position: absolute; inset: 0; }
.motivo { position: absolute; top: 0; bottom: 0; background: url("patron.svg") repeat; background-size: var(--modulo, 160px); opacity: .9; }
/* Contenido: dentro de la zona segura y fuera de las zonas tapadas (el script estrecha la zona). Motivo: solo en la franja libre más ancha, nunca detrás del texto. */
.seguro { position: absolute; display: flex; align-items: center; box-sizing: border-box; }
.marca { display: flex; align-items: center; gap: calc(var(--u) * .5); }
.marca img { height: calc(var(--u) * 1); display: block; }
.textos { display: flex; flex-direction: column; gap: calc(var(--u) * .14); }
.lema { font-family: var(--font-display); font-weight: 700; letter-spacing: -.02em; line-height: 1; font-size: calc(var(--u) * .62); margin: 0; white-space: nowrap; }
.dato { font-family: var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); font-size: max(16px, calc(var(--u) * .16)); }
.oculto { display: none !important; }
/* Guías */
.guia { position: absolute; box-sizing: border-box; pointer-events: none; display: none; font: 600 14px/1.2 system-ui, sans-serif; color: #fff; }
.guias .guia { display: block; }
.g-seguro { outline: 3px dashed #f0f; }
.g-tapado { background: rgba(255, 0, 170, .35); border: 2px solid #f0a; }
.g-tapado.circulo { border-radius: 50%; }
.g-recorte { background: repeating-linear-gradient(45deg, rgba(0,0,0,.35) 0 10px, rgba(0,0,0,.12) 10px 20px); }
.g-banda { outline: 2px dotted #0bf; }
.guia span { position: absolute; left: 6px; top: 4px; background: rgba(0,0,0,.6); padding: 2px 6px; }
</style>
</head>
<body>
<div class="lienzo">
  <div class="fondo"><div class="motivo" aria-hidden="true"></div></div>
  <div class="seguro">
    <div class="marca"><img src="logo.svg" alt="">
      <div class="textos"><p class="lema" data-ejemplo>Eslogan de la marca.</p><div class="dato" data-ejemplo>@marca · web.ejemplo</div></div>
    </div>
  </div>
</div>
<script>
const q = new URLSearchParams(location.search);
const F = window.FORMATOS.formatos, clave = q.get("f") || "og";
const base = F[clave] || { w: 1200, h: 630, seguro: [60, 60, 1080, 510], tapado: [], recortes: [], bandas: [], alinear: "centro" };
const W = +q.get("w") || base.w, H = +q.get("h") || base.h;
const mismo = W === base.w && H === base.h;
// Con un tamaño distinto (comprobado en la plataforma): si la proporción es la misma se escala todo; si no, zona segura genérica.
const k = W / base.w, proporcional = Math.abs(W / H - base.w / base.h) < 0.01;
const esc = r => r.map((v, i) => (i < 4 ? Math.round(v * k) : v));
const seguro = mismo ? base.seguro : proporcional ? esc(base.seguro) : [Math.round(W * .1), Math.round(H * .15), Math.round(W * .8), Math.round(H * .7)];
const lista = n => (mismo ? base[n] : proporcional ? (base[n] || []).map(r => r[0] === "circulo" || r[0] === "rect" ? [r[0], ...esc(r.slice(1))] : esc(r)) : []);
const L = document.querySelector(".lienzo");
L.style.width = W + "px"; L.style.height = H + "px";
document.documentElement.classList.add("f-" + clave);
// Zona de contenido = zona segura menos lo que tapa la interfaz (foto de perfil, logo de página, menús).
const gap = Math.round(Math.min(W, H) * .04);
let [zx, zy, zw, zh] = seguro;
lista("tapado").forEach(t => {
  const [x, y, w, h] = t.slice(1, 5);
  if (y >= zy + zh || y + h <= zy || x >= zx + zw || x + w <= zx) return;      // no se cruzan
  if (w >= W * .9) { const n = Math.max(zy, y + h + gap); zh -= n - zy; zy = n; return; }  // banda superior
  if (x + w / 2 < W / 2) { const n = Math.max(zx, x + w + gap); zw -= n - zx; zx = n; }   // a la izquierda
  else zw = Math.min(zx + zw, x - gap) - zx;                                     // a la derecha
});
const S = document.querySelector(".seguro");
Object.assign(S.style, { left: zx + "px", top: zy + "px", width: zw + "px", height: zh + "px" });
const M = document.querySelector(".motivo"), libreIzq = zx - gap, libreDer = W - (zx + zw) - gap;
if (Math.max(libreIzq, libreDer) < W * .06) M.remove();
else if (libreDer >= libreIzq) Object.assign(M.style, { right: 0, width: libreDer + "px" });
else Object.assign(M.style, { left: 0, width: libreIzq + "px" });
const alinear = q.get("alinear") || base.alinear || "centro";
S.style.justifyContent = { centro: "center", derecha: "flex-end", izquierda: "flex-start" }[alinear];
// Unidad de composición: la altura de la zona segura manda; en formatos muy bajos se quita el dato.
document.documentElement.style.setProperty("--u", Math.round(zh * .42) + "px");
if (zh < 220) document.querySelector(".dato").classList.add("oculto");
if (q.get("lema")) document.querySelector(".lema").textContent = q.get("lema");
if (q.get("dato")) document.querySelector(".dato").textContent = q.get("dato");
if (q.get("tema")) document.documentElement.dataset.theme = q.get("tema");
// Si no cabe a lo ancho, se reduce la unidad hasta que quepa.
let u = zh * .42;
const C = document.querySelector(".marca");
while ((C.getBoundingClientRect().width > zw || C.getBoundingClientRect().height > zh) && u > 8) { u *= .94; document.documentElement.style.setProperty("--u", u + "px"); }
function guia(clase, r, texto) {
  const d = document.createElement("div");
  d.className = "guia " + clase;
  Object.assign(d.style, { left: r[0] + "px", top: r[1] + "px", width: r[2] + "px", height: r[3] + "px" });
  if (texto) d.innerHTML = "<span></span>", d.firstChild.textContent = texto;
  L.appendChild(d);
}
lista("recortes").forEach(r => guia("g-recorte", r, r[4]));
lista("bandas").forEach(r => guia("g-banda", r, r[4]));
lista("tapado").forEach(r => guia("g-tapado " + r[0], r.slice(1), r[5]));
guia("g-seguro", seguro, "Zona segura");
if (zx !== seguro[0] || zy !== seguro[1] || zw !== seguro[2] || zh !== seguro[3]) guia("g-banda", [zx, zy, zw, zh], "Contenido (fuera de lo tapado)");
if (q.get("guias")) document.documentElement.classList.add("guias");
</script>
</body>
</html>
