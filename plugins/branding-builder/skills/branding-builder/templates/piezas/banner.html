<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Plantilla de ESTRUCTURA: cabeceras y banners. Elige el formato con ?f=
       x        1500×500   (la foto de perfil tapa la esquina inferior izquierda)
       youtube  2560×1440  (zona segura 1546×423 centrada: lo que se ve en todos los dispositivos)
       linkedin 1584×396   (la foto de perfil tapa la parte izquierda)
       og       1200×630   (imagen al compartir la web)
     Renderiza con el tamaño en el nombre: render.py png banner.html X-cabecera_1500x500.png --param f=x
     Las zonas reservadas son aproximadas: revisa siempre en la plataforma. Parámetros: ?tema=<id> ?guias=1 -->
<link rel="stylesheet" href="brand.css">
<style>
html, body { margin: 0; }
.lienzo { position: relative; overflow: hidden; background: var(--bg); color: var(--ink); width: var(--w); height: var(--h); }
.seguro { position: absolute; display: flex; align-items: center; justify-content: space-between; gap: 48px; }
.marca { display: flex; align-items: center; gap: 32px; }
.marca img { height: var(--logo); display: block; }
.lema { font-family: var(--font-display); font-weight: 700; letter-spacing: -.02em; line-height: 1; }
.lema { font-size: var(--lema); margin: 0; }
.dato { font-family: var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
.dato { font-size: var(--dato); }
.motivo { position: absolute; top: 0; bottom: 0; right: 0; width: 28%; background-image: url("patron.svg"); }
.reserva { position: absolute; display: none; background: #f0f3; }
.guias .seguro { outline: 2px dashed #f0f; }
.guias .reserva { display: block; }
.f-x { --w: 1500px; --h: 500px; --logo: 96px; --lema: 64px; --dato: 22px; }
.f-x .seguro { top: 60px; bottom: 60px; left: 480px; right: 80px; }
.f-x .reserva { left: 0; bottom: 0; width: 420px; height: 200px; }
.f-youtube { --w: 2560px; --h: 1440px; --logo: 150px; --lema: 96px; --dato: 30px; }
.f-youtube .seguro { left: 507px; top: 508px; width: 1546px; height: 423px; padding: 0 40px; box-sizing: border-box; }
.f-linkedin { --w: 1584px; --h: 396px; --logo: 80px; --lema: 52px; --dato: 20px; }
.f-linkedin .seguro { top: 48px; bottom: 48px; left: 600px; right: 72px; }
.f-linkedin .reserva { left: 0; top: 0; width: 560px; height: 396px; }
.f-og { --w: 1200px; --h: 630px; --logo: 120px; --lema: 64px; --dato: 22px; }
.f-og .seguro { inset: 60px; flex-direction: column; align-items: flex-start; justify-content: space-between; }
</style>
</head>
<body>
<div class="lienzo">
  <div class="motivo" aria-hidden="true"></div>
  <div class="reserva" aria-hidden="true"></div>
  <div class="seguro">
    <div class="marca"><img src="logo.svg" alt=""></div>
    <p class="lema" data-ejemplo>Eslogan de la marca.</p>
    <div class="dato" data-ejemplo>WEB.EJEMPLO</div>
  </div>
</div>
<script>
const q = new URLSearchParams(location.search);
document.querySelector(".lienzo").classList.add("f-" + (q.get("f") || "og"));
if (q.get("guias")) document.documentElement.classList.add("guias");
if (q.get("tema")) document.documentElement.dataset.theme = q.get("tema");
</script>
</body>
</html>
